<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Openingstijden-strip · Autosloperij J. Weber</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body class="stage">
  <div class="canvas canvas--strip" role="img"
       aria-label="Losse openingstijden-strip: maandag tot en met vrijdag 09:00 tot 17:00, weekend gesloten">
    <div class="strip">
      <span class="strip__screw strip__screw--tl" aria-hidden="true"></span>
      <span class="strip__screw strip__screw--tr" aria-hidden="true"></span>
      <span class="strip__screw strip__screw--bl" aria-hidden="true"></span>
      <span class="strip__screw strip__screw--br" aria-hidden="true"></span>

      <span class="kicker">Openingstijden</span>
      <span class="strip__times">
        <span class="strip__day">Ma&ndash;vr</span>
        <span class="strip__hours">09:00&ndash;17:00</span>
        <span class="strip__dot" aria-hidden="true"></span>
        <span class="strip__closed">Weekend gesloten</span>
      </span>
    </div>
  </div>
</body>
</html>
