<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gevelbord met openingstijden — wit paneel · Autosloperij J. Weber</title>
  <link rel="stylesheet" href="tokens.css">
</head>
<body class="stage">
  <div class="canvas canvas--sign canvas--sign-hours" role="img"
       aria-label="Gevelbord Autosloperij J. Weber, wit paneel met geïntegreerde openingstijden: wordmerk, telefoonnummer 040 285 3261, Spaarpot 114 Geldrop, autosloperijweber.nl, openingstijden maandag tot en met vrijdag 09:00 tot 17:00, weekend gesloten">
    <div class="sign-panel">
      <div class="sign">
        <div class="sign__brand">
          <span class="wm">
            <span class="wm__mono">JW</span>
            <span class="wm__text">
              <span class="wm__name">J.&nbsp;Weber</span>
              <span class="wm__qual">Autosloperij · Autodemontage</span>
            </span>
          </span>
          <span class="sign__meta">
            <span class="sign__meta-addr">Spaarpot 114, Geldrop</span>
            <span class="sign__meta-domain sub">autosloperijweber.nl</span>
          </span>
        </div>
        <div class="sign__call">
          <span class="kicker">Bel voor onderdelen</span>
          <a class="sign__phone" href="tel:+31402853261">040&nbsp;285&nbsp;3261</a>
        </div>
      </div>
      <div class="sign__hours">
        <span class="sign__hours-label">Openingstijden</span>
        <span class="sign__hours-times">
          <span class="sign__hours-day">Ma&ndash;vr</span>
          <span class="sign__hours-val">09:00&ndash;17:00</span>
          <span class="sign__hours-sep" aria-hidden="true"></span>
          <span class="sign__hours-closed">Weekend gesloten</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
