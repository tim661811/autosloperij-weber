version: 2
updates:
  # npm build-time dependencies (Astro, sitemap integration, fontsource, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Keeps the SHA-pinned GitHub Actions in deploy.yml bumped safely.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
